<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="shortcut icon" href="./assets/icons/pokeball.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/standard.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/colors.css">
    <link rel="stylesheet" href="./css/loadingScreen.css">
    <link rel="stylesheet" href="./css/responsiveness.css">
    <script src="./js/templates.js"></script>
    <script src="./js/script.js" defer></script>
    <script src="./js/eventListeners.js" defer></script>
</head>
<body onload="init()">
    <div id="loadingOverlay">
        <div class="loader"></div>
    </div>    
    <header>
        <div class="content">
            <img src="./assets/icons/pokemon-logo.png" alt="pokémon-logo">
            <div class="searchbar">
                <input data-id="search-input" type="text" id="searchInput" placeholder="Search Pokémon">
                <button data-id="search-button" id="searchButton">Search</button>
            </div>
        </div>
    </header>
    <main data-id="content">
        <div class="content">
            <div id="gallery"></div>
            <p data-id="not-found" id="noResults" class="d-none">No Pokémon found.</p>
            <button data-id="load-more-button" id="loadMore">Load more Pokémon</button>
        </div>
    </main>
    <footer>
        <div class="content">
            <p>made by Jonas Nell</p>
        </div>
    </footer>
    <dialog data-id="dialog" id="pokemonDialog">
        <button data-id="close-dialog-button" id="closeDialog">X</button>
        <div data-id="overlay-pokemon-name" id="dialogContent"></div>
    </dialog>
</body>
</html>
