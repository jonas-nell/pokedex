<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="shortcut icon" href="./assets/icons/pokeball.png" type="image/x-icon">
    <link rel="stylesheet" href="standard.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="colors.css">
    <link rel="stylesheet" href="loadingScreen.css">
    <script src="./templates.js"></script>
    <script src="./script.js" defer></script>
    <script src="./eventListeners.js" defer></script>
</head>
<body onload="init()">
    <div id="loadingOverlay">
        <div class="loader"></div>
    </div>    
    <header>
        <div class="content">
            <img src="./assets/icons/pokemon-logo.png" alt="pokémon-logo">
            <div class="searchbar">
                <input type="text" id="searchInput" placeholder="Search Pokémon">
                <button id="searchButton">Search</button>
            </div>
        </div>
    </header>
    <main>
        <div class="content">
            <div id="gallery"></div>
            <button id="loadMore">Load more Pokémon</button>
            <p id="noResults" class="d-none">No Pokémon found.</p>
        </div>
    </main>
    <footer>
        <div class="content">
            <p>made by Jonas Nell</p>
        </div>
    </footer>
</body>
</html>
